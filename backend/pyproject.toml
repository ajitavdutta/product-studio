[project]
name = "product-studio-backend"
version = "0.1.0"
description = "Product Studio API: Jira import, roadmaps, swimlane diagrams and exports"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cairosvg>=2.9.1",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "lxml>=6.1.3",
    "pydantic-settings>=2.16.2",
    "python-dateutil>=4.0.0",
    "python-multipart>=0.0.33",
    "python-pptx>=1.0.2",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the library as first-party.
known-third-party = ["alembic"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cairosvg.*", "pptx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "types-defusedxml>=0.7.0.20260504",
    "types-python-dateutil>=2.9.0.20261104",
]
