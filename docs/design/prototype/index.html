<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Studio — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--p:#1976d2;--p2:#1565c0;--pd:#0d47a1;--pt:#e3f2fd;--tx:#212121;--t2:#424242;--t3:#616161;--bd:#e0e0e0;--bi:#c4c4c4;--bg:#fafafa;--ok:#2e7d32;--risk:#bf360c;--err:#d32f2f;--ms:#6a1b9a}
*{box-sizing:border-box}
body{min-height:100vh}
html{scroll-padding-bottom:130px}
html:has(body.noguide){scroll-padding-bottom:0}
body{margin:0;font-family:Roboto,system-ui,sans-serif;color:var(--tx);background:var(--bg);font-size:13px;padding-bottom:120px}
body.noguide{padding-bottom:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--p)}
h1,h2,h3{margin:0;font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.appbar{min-height:56px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:20px;padding:0 20px;position:sticky;top:0;z-index:30;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500;background:none;border:0;cursor:pointer;padding:0}
.nav{display:flex;align-self:stretch;gap:2px}
.nav a{display:flex;align-items:center;padding:0 14px;font-size:14px;font-weight:500;color:var(--t2);text-decoration:none;border-bottom:2px solid transparent;min-height:56px}
.nav a.on{color:var(--p);border-bottom-color:var(--p)}
.spacer{flex:1}
.saved{display:flex;align-items:center;gap:6px;color:var(--ok);font-size:13px}
.unsaved{color:var(--t3)}
.btn{height:34px;padding:0 12px;border-radius:4px;border:1px solid var(--bi);background:#fff;color:var(--t2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover{background:#f5f5f5}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.btn.pri:hover{background:var(--p2)}
.btn.out{border-color:var(--p);color:var(--p);font-weight:500}
.btn.out:hover{background:#f5f9ff}
.btn.txt{border:0;background:transparent;color:var(--p);font-weight:500;padding:0 6px}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.sm{height:30px;font-size:12px}
.btn.lg{height:40px;padding:0 18px}
.btn[disabled]{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--bi);border-radius:4px;overflow:hidden;background:#fff}
.seg button{height:30px;padding:0 12px;border:0;border-left:1px solid var(--bi);background:#fff;cursor:pointer;color:var(--t2)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--pt);color:var(--pd);font-weight:500}
.seg.full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.card{background:#fff;border:1px solid var(--bd);border-radius:8px}
.pad{padding:16px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--t3)}
.input,.select{height:34px;border:1px solid var(--bi);border-radius:4px;padding:0 8px;background:#fff;color:var(--tx);font-size:13px;width:100%}
textarea.input{height:auto;padding:8px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--p);margin:0}
.mono{font-family:'Roboto Mono',monospace}
.key{font-family:'Roboto Mono',monospace;color:var(--p2);font-size:11px}
.muted{color:var(--t3)}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.6px;color:var(--t3);text-transform:uppercase}
.toolbar{background:#fff;border-bottom:1px solid var(--bd);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vsep{width:1px;height:24px;background:var(--bd)}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--t2);background:var(--pt);border-radius:14px;padding:5px 12px}
.page{max-width:1440px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:20px}
.h1{font-size:22px}
.lede{margin:4px 0 0;font-size:14px;color:var(--t3)}
.row{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.grow{flex:999 1 520px;min-width:0}
.side{flex:1 1 300px;max-width:380px;min-width:0}
.dot{width:10px;height:10px;border-radius:5px;display:inline-block;flex:none}
.sq{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.diamond{width:10px;height:10px;background:var(--ms);transform:rotate(45deg);display:inline-block;flex:none}
/* home */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.tile{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:20px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.tile:hover{border-color:var(--p);background:#f5f9ff}
.tile b{font-size:15px;font-weight:500}
.tile span{color:var(--t3);font-size:13px;line-height:1.45}
.list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1}
/* import */
.stepper{display:flex;align-items:center;gap:10px;list-style:none;margin:0;padding:0;font-size:13px}
.stepper li{display:flex;align-items:center;gap:8px;color:var(--t3)}
.stepper .n{width:24px;height:24px;border-radius:12px;border:1px solid #9e9e9e;display:flex;align-items:center;justify-content:center;font-size:12px}
.stepper li.on{color:var(--p);font-weight:500}.stepper li.on .n{background:var(--p);border-color:var(--p);color:#fff}
.stepper li.done{color:var(--ok);font-weight:500}.stepper li.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.stepper .ln{width:32px;height:1px;background:var(--bi)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed #90caf9;background:#f5f9ff;border-radius:10px;min-height:220px;cursor:pointer;text-align:center;padding:24px}
.drop.over{background:var(--pt);border-color:var(--p)}
.drop b{font-size:16px;font-weight:500}
.or{display:flex;align-items:center;gap:12px;color:var(--t3);margin:16px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--bd)}
table.map{width:100%;border-collapse:collapse;min-width:520px}
table.map th{text-align:left;font-size:12px;font-weight:500;color:var(--t3);padding:10px 16px;border-bottom:1px solid var(--bd)}
table.map td{padding:6px 16px;border-bottom:1px solid #eee}
.select.warn{border:2px solid #e65100;background:#fff3e0;color:#bf360c}
.badge{font-size:12px;font-weight:500;padding:4px 10px;border-radius:12px}
.badge.ok{color:#1b5e20;background:#e8f5e9}.badge.warn{color:#8a3a00;background:#fff3e0}
.warnbox{list-style:none;margin:0;padding:10px 12px;background:#fff8e1;border-radius:6px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:#5d4037}
.code{background:#263238;color:#cfd8dc;border-radius:8px;padding:14px 16px;font-family:'Roboto Mono',monospace;font-size:11.5px;line-height:1.55;white-space:pre;overflow:auto;margin:0;max-height:360px}
.stat{border:1px solid var(--bd);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat .l{font-size:11px;color:var(--t3)}.stat .v{font-size:20px;font-weight:500}
.actionbar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
/* roadmap */
.insights{background:#fff;border-bottom:1px solid var(--bd);padding:12px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bar4{height:4px;background:#bbdefb;border-radius:2px}.bar4>i{display:block;height:4px;background:var(--p);border-radius:2px}
.work{display:flex;flex-wrap:wrap;align-items:stretch;min-height:calc(100vh - 260px)}
.tlwrap{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;background:#fff}
.tlscroll{overflow-x:auto;flex:1}
.tl{position:relative}
.tl-head{position:relative;height:56px;border-bottom:1px solid var(--bd);background:#fff}
.tl-corner{position:absolute;left:0;top:0;width:220px;height:55px;padding:0 16px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--bd);font-size:11px;color:var(--t3)}
.hc{position:absolute;border-left:1px solid var(--bd);padding:0 8px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;white-space:nowrap;line-height:1.25;background:#fff}
.hc b{font-size:13px;font-weight:500}.hc small{font-size:10px;color:var(--t3)}
.hc.center{align-items:center;text-align:center}
.hc.piband{background:#eceff1;border-left:2px solid #90a4ae;border-bottom:1px solid var(--bd)}.hc.piband b{font-size:11px;font-weight:700;color:#37474f}
.hc.pibig{border-left:2px solid #90a4ae;border-bottom:1px solid var(--bd)}
.hc.first{border-left:2px solid #90a4ae}
.hc.sprint b{font-size:12px}
.hc.tick{padding:0}.hc.tick b{font-size:10px;font-weight:400;color:var(--t2)}
.hc.ip{background:repeating-linear-gradient(135deg,rgba(120,144,156,.18) 0 4px,#f7f9fa 4px 8px)}
.hc.cur{background:var(--pt)}.hc.cur b,.hc.cur small{color:var(--pd);font-weight:700}
.tl-ms{position:relative;height:34px;border-bottom:1px solid var(--bd);background:#fcfcfc}
.tl-ms .lbl{position:absolute;left:0;top:0;width:220px;height:33px;padding:0 16px;display:flex;align-items:center;font-size:12px;color:var(--t3)}
.msbtn{position:absolute;top:6px;height:22px;border:0;background:transparent;padding:0;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:#4a148c;cursor:pointer;white-space:nowrap}
.msbtn .diamond{width:12px;height:12px;box-shadow:0 0 0 2px #fcfcfc}
.freeze{position:absolute;top:6px;height:22px;border-radius:4px;background:repeating-linear-gradient(135deg,#546e7a 0 4px,#90a4ae 4px 8px);display:flex;align-items:center;justify-content:center;overflow:hidden}
.freeze span{font-size:11px;font-weight:500;color:#fff;background:#455a64;padding:0 5px;border-radius:3px;white-space:nowrap}
.lanehd{height:30px;display:flex;align-items:center;gap:8px;background:#f5f5f5;border-bottom:1px solid var(--bd);padding:0 16px;font-size:12px;font-weight:500;position:relative}
.erow{position:relative;height:44px;border-bottom:1px solid #eee}
.erow.sel{background:rgba(227,242,253,.6)}
.elabel{position:absolute;left:0;top:0;width:220px;height:43px;padding:0 16px;display:flex;flex-direction:column;justify-content:center;background:#fff;border-right:1px solid var(--bd);cursor:pointer;text-align:left;border-top:0;border-bottom:0;border-left:0}
.elabel span:last-child{font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ebar{position:absolute;top:7px;height:30px;border:0;border-radius:6px;color:#fff;padding:0 8px;display:flex;flex-direction:column;justify-content:center;gap:3px;cursor:pointer;text-align:left;min-width:0}
.ebar .t{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.ebar .pg{display:block;width:100%;height:3px;background:rgba(255,255,255,.35);border-radius:2px}.ebar .pg i{display:block;height:3px;background:#fff;border-radius:2px}
.ebar.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pd)}
.ov{position:absolute;bottom:0;pointer-events:none}
.today-lbl{position:absolute;top:64px;height:18px;display:flex;align-items:center;font-size:10px;font-weight:700;letter-spacing:.4px;color:#fff;background:#c62828;border-radius:3px;padding:0 6px;white-space:nowrap;pointer-events:none}
.tray{border-top:1px solid var(--bd);padding:12px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fafafa}
.trayitem{font-size:12px;background:#fff;border:1px solid var(--bi);border-radius:4px;padding:4px 8px;display:flex;gap:6px;cursor:pointer}
.legend{padding:8px 16px;display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--t2);border-top:1px solid var(--bd);background:#fff}
.legend span{display:flex;align-items:center;gap:6px}
.detail{flex:1 1 320px;max-width:360px;background:#fff;border-left:1px solid var(--bd);display:flex;flex-direction:column}
.detail .sec{padding:16px;border-bottom:1px solid var(--bd)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.story{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;border-bottom:1px solid #f5f5f5}
/* swimlanes */
.palette{background:#fff;border-bottom:1px solid var(--bd);padding:6px 20px;display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.tool{height:36px;padding:0 10px;border:0;border-radius:4px;background:transparent;color:var(--t2);font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer}
.tool:hover{background:#f5f5f5}.tool.on{background:var(--pt);color:var(--pd);font-weight:500}
.canvas{flex:999 1 640px;min-width:0;overflow:auto;padding:16px;background-color:#eef1f4;background-image:radial-gradient(#cfd8dc 1px,transparent 1px);background-size:16px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.canvas>.frame{margin:0 auto}.canvas>p{align-self:center}
.frame{background:#fff;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);border-radius:4px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:16px;flex:none}
.frame.placing svg .bgrect{cursor:crosshair}
.insp{flex:1 1 300px;max-width:320px;background:#fff;border-left:1px solid var(--bd);display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--bd)}
.tabs button{flex:1;height:44px;border:0;background:#fff;border-bottom:2px solid transparent;color:var(--t2);font-weight:500;cursor:pointer}
.tabs button.on{color:var(--p);border-bottom-color:var(--p)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:14px;border:0;cursor:pointer;box-shadow:0 0 0 1px var(--bi)}
.sw.on{box-shadow:0 0 0 1px var(--bi),0 0 0 3px #fff,0 0 0 5px var(--p)}
.lanerow{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--bd);border-radius:6px}
.lanerow input{flex:1;min-width:0;height:28px;border:1px solid transparent;border-radius:4px;padding:0 4px}
.lanerow input:hover,.lanerow input:focus{border-color:var(--bi)}
.zoomctl{display:inline-flex;align-items:center;border:1px solid var(--bi);border-radius:4px;overflow:hidden;background:#fff;height:32px}
.zoomctl button{height:30px;min-width:30px;border:0;background:#fff;cursor:pointer;color:var(--t2);display:inline-flex;align-items:center;justify-content:center;font-size:13px;padding:0 8px}
.zoomctl button:hover{background:#f5f5f5}
.zoomctl .zl{min-width:56px;border-left:1px solid var(--bi);border-right:1px solid var(--bi);font-variant-numeric:tabular-nums;font-weight:500}
.zoomctl .zf{border-left:1px solid var(--bi)}
.zoomctl button[disabled]{opacity:.4;cursor:default}
.iconbtn{width:32px;height:32px;border:0;border-radius:16px;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{background:#f5f5f5}
.rail{flex:0 0 48px;width:48px;background:#fff;border-left:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.rail .vlabel{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;color:var(--t2);font-weight:500;margin-top:8px;white-space:nowrap;max-height:60vh;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:none;border:0;padding:6px 0}
.rail .vlabel:hover{color:var(--p)}
.rail .iconbtn[aria-pressed="true"]{background:var(--pt)}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.statusbar{background:#fff;border-top:1px solid var(--bd);padding:8px 20px;display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--t3)}
.hint{font-size:12px;color:#0d47a1;background:var(--pt);border-radius:4px;padding:6px 10px}
#svgHost svg{user-select:none;-webkit-user-select:none;touch-action:none}
#svgHost svg .shape{cursor:move}
.frame.placing #svgHost svg .shape{cursor:pointer}
svg .handles{opacity:0;transition:opacity .12s}
svg g.shape:hover .handles,svg g.shape.sel .handles,svg g.shape:focus-visible .handles{opacity:1}
svg.dragging .handles{opacity:0!important}
svg .hdl{cursor:crosshair}
.picker{position:fixed;z-index:78;background:#fff;border-radius:8px;box-shadow:0 5px 5px -3px rgba(0,0,0,.2),0 8px 10px 1px rgba(0,0,0,.14);padding:8px;display:none;width:196px}
.picker.open{display:block}
.picker .ph{font-size:11px;font-weight:500;color:var(--t3);margin:0 2px 6px;letter-spacing:.3px}
.picker .pg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.picker button{height:44px;border:1px solid transparent;border-radius:6px;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9.5px;color:var(--t2);padding:0}
.picker button:hover,.picker button:focus-visible{background:var(--pt);border-color:#90caf9;color:var(--pd);outline:none}
.picker button svg{width:22px;height:22px}
.addrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.addrow button{height:36px;border:1px solid var(--bd);border-radius:6px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.addrow button:hover{background:var(--pt);border-color:#90caf9}
svg .hdl circle{fill:#1976d2;fill-opacity:.85}
svg .hdl:hover circle{fill:#0d47a1;fill-opacity:1}
svg .ehit{cursor:pointer}
svg .lres{cursor:ns-resize}svg .wres{cursor:ew-resize}
svg .lres:hover,svg .wres:hover{fill:rgba(25,118,210,.22)}
svg g.edge:hover .evis{stroke:#1976d2}
svg .shape:hover .body{filter:brightness(.97)}
/* export */
.pv{background:#eef1f4;border:1px solid var(--bd);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px}
.sheet{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);border-radius:2px;position:relative;overflow:hidden;padding:3.5%;display:flex;flex-direction:column;gap:2.5%;container-type:inline-size;margin:0 auto}
.sheet .ttl{font-size:2.2cqw;font-weight:700}.sheet .sub{font-size:1.3cqw;color:var(--t3)}
.sheet .content{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.sheet .content svg{width:100%;height:100%}
.sheet .stamp{display:flex;justify-content:space-between;font-size:1.1cqw;color:var(--t3);border-top:1px solid var(--bd);padding-top:.6cqw}
.wm{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;container-type:inline-size}
.wm.tiled{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);place-items:center}
.wm .t{font-weight:700;white-space:nowrap;letter-spacing:.15em;transform:rotate(-28deg)}
.slegend{display:flex;flex-direction:column;gap:.5cqw;align-items:flex-end;font-size:.92cqw;color:#424242;max-width:62%}
.slegend .row{display:flex;gap:.4cqw 1.2cqw;flex-wrap:wrap;justify-content:flex-end}
.slegend .it{display:inline-flex;align-items:center;gap:.45cqw;white-space:nowrap}
.slegend .k{font-weight:700;color:#37474f}.slegend .mk{color:#4a148c}.slegend .tk{color:#c62828}
.slegend .sym{display:inline-block;width:.85cqw;height:.85cqw;border-radius:.15cqw;flex:none}
.slegend .dm{background:#6a1b9a;transform:rotate(45deg);border-radius:0;width:.7cqw;height:.7cqw}
.slegend .fz{background:repeating-linear-gradient(45deg,rgba(84,110,122,.45) 0 .2cqw,transparent .2cqw .45cqw);outline:1px dashed #546e7a}
.slegend .td{width:.22cqw;height:1.1cqw;background:#d32f2f;border-radius:0}
.slegend .ip{background:repeating-linear-gradient(45deg,#cfd8dc 0 .2cqw,#f7f9fa .2cqw .45cqw);outline:1px solid #b0bec5}
.slegend .cu{background:#e3f2fd;outline:1px solid #90caf9}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px}
.thumb{flex:0 0 168px;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left}
.thumb .tn{display:block;border-radius:3px;outline:2px solid transparent;outline-offset:2px;pointer-events:none}
.thumb.on .tn{outline-color:var(--p)}

/* ---------- timeline model (shared by roadmap + export preview) ---------- */
const SPRINT_W=104;
/* sprint date label that fits the column: full range, compact range, or start date only */
function sprintDates(x,colW){const a=new Date(2026,10,1+x.s),b=new Date(2026,10,1+x.e-1);
  if(colW>=96)return date(x.s)+' – '+date(x.e-1);
  if(colW>=70)return a.getMonth()===b.getMonth()?a.getDate()+'–'+b.getDate()+' '+MON[b.getMonth()]:date(x.s)+'–'+date(x.e-1);
  return colW>=44?date(x.s):''}
function TL(zoom,range,colW){
  const R=range||{months:[0,181],sprints:[1,183],pis:[-27,225]}[zoom];const span=R[1]-R[0];
  const f=d=>(Math.min(Math.max(d,R[0]),R[1])-R[0])/span;const inView=(a,b)=>b>R[0]&&a<R[1];
  const head=[],lines=[],bands=[];
  if(zoom==='months'){
    [['Nov',0,30],['Dec',30,61],['Jan',61,92],['Feb',92,120],['Mar',120,151],['Apr',151,181]].filter(([n,a,b])=>inView(a,b)).forEach(([n,a,b],i)=>{
      const mid=(a+b)/2,pi=PIS.find(p=>mid>=p.start&&mid<p.end);
      head.push({a,b,top:0,h:55,label:n+(a===0?' 2026':a===61?' 2027':''),sub:pi.name,cls:''});
      if(i)lines.push({d:a,w:1,c:'#e0e0e0'})});
  }else if(zoom==='sprints'){
    PIS.filter(p=>inView(p.start,p.end)).forEach(p=>head.push({a:p.start,b:p.end,top:0,h:22,label:p.name,cls:'piband center'}));
    SPRINTS.filter(x=>inView(x.s,x.e)).forEach(x=>{
      head.push({a:x.s,b:x.e,top:22,h:33,label:'S'+x.n+(x.ip?' · IP':''),sub:colW?sprintDates(x,colW):date(x.s)+' – '+date(x.e-1),full:x.pi.name+' · S'+x.n+(x.ip?' (IP)':'')+' · '+date(x.s)+' – '+date(x.e-1),cls:'sprint center'+(x.first?' first':'')+(x.cur?' cur':x.ip?' ip':'')});
      if(x.s>R[0])lines.push({d:x.s,w:x.first?2:1,c:x.first?'#b0bec5':'#eeeeee'});
      if(x.ip)bands.push({a:x.s,b:x.e})});
  }else{
    PIS.forEach(p=>{head.push({a:p.start,b:p.end,top:0,h:34,label:p.name,sub:p.sub,cls:'pibig center'});if(p.start>R[0])lines.push({d:p.start,w:2,c:'#b0bec5'})});
    SPRINTS.forEach(x=>{head.push({a:x.s,b:x.e,top:34,h:21,label:x.ip?'IP':'S'+x.n,cls:'tick center'+(x.first?' first':'')+(x.cur?' cur':x.ip?' ip':'')});
      if(!x.first)lines.push({d:x.s,w:1,c:'#f2f2f2'});if(x.ip)bands.push({a:x.s,b:x.e})});
  }
  return {R,f,head,lines,bands,minW:zoom==='sprints'?220+13*SPRINT_W:900};
}

/* ---------- zoom (roadmap timeline + swimlane canvas) ---------- */
const ZLIM={rm:[.5,3],dg:[.25,2.5]};
const ZSTEPS=[.25,.33,.5,.67,.75,.9,1,1.1,1.25,1.5,1.75,2,2.5,3];
const zget=k=>k==='rm'?S.rmZoom[S.zoom]:S.dgZoom;
function zoomCtl(k){const z=zget(k),[lo,hi]=ZLIM[k];
  return `<div class="zoomctl" role="group" aria-label="Zoom"><button data-act="zoomStep" data-k="${k}" data-d="-1" aria-label="Zoom out" title="Zoom out (Ctrl −)" ${z<=lo+1e-6?'disabled':''}><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2"/></svg></button><button class="zl" id="zl-${k}" data-act="zoomReset" data-k="${k}" title="Reset to 100% (Ctrl 0)" aria-label="Zoom ${Math.round(z*100)}%, reset to 100%">${Math.round(z*100)}%</button><button data-act="zoomStep" data-k="${k}" data-d="1" aria-label="Zoom in" title="Zoom in (Ctrl +)" ${z>=hi-1e-6?'disabled':''}><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="2"/></svg></button><button class="zf" data-act="zoomFit" data-k="${k}" title="Fit to window">Fit</button></div>`}
function refreshZoomCtl(k){const c=document.querySelector(`#zl-${k}`);if(c)c.closest('.zoomctl').outerHTML=zoomCtl(k)}
function setZoom(k,z,anchor){const [lo,hi]=ZLIM[k];z=Math.min(hi,Math.max(lo,Math.round(z*1000)/1000));const old=zget(k);if(Math.abs(z-old)<.001)return;
  if(k==='dg'){const sc=document.querySelector('.canvas');if(!sc){S.dgZoom=z;return}const r=sc.getBoundingClientRect();
    const ax=anchor?anchor.x-r.left:r.width/2,ay=anchor?anchor.y-r.top:r.height/2;const cx=sc.scrollLeft+ax,cy=sc.scrollTop+ay;
    S.dgZoom=z;redrawCanvas();const q=z/old;sc.scrollLeft=cx*q-ax;sc.scrollTop=cy*q-ay}
  else{const sc=document.querySelector('.tlscroll');if(!sc){S.rmZoom[S.zoom]=z;return}const tl0=sc.querySelector('.tl');const oldW=tl0?tl0.offsetWidth:sc.clientWidth;
    const r=sc.getBoundingClientRect();const ax=anchor?anchor.x-r.left:r.width/2;const pos=Math.max(0,(sc.scrollLeft+ax-220)/Math.max(1,oldW-220));
    S.rmZoom[S.zoom]=z;sc.innerHTML=timelineHTML();const nw=sc.querySelector('.tl').offsetWidth;sc.scrollLeft=220+pos*(nw-220)-ax}
  refreshZoomCtl(k)}
function zoomStep(k,d,anchor){const z=zget(k);const next=d>0?ZSTEPS.find(v=>v>z+.001):[...ZSTEPS].reverse().find(v=>v<z-.001);if(next!=null)setZoom(k,next,anchor)}
function zoomFit(k){if(k==='dg'){const sc=document.querySelector('.canvas');if(!sc)return;const {W}=dgSize();setZoom('dg',Math.floor((sc.clientWidth-32-48-4)/W*1000)/1000);sc.scrollLeft=0}
  else{const sc=document.querySelector('.tlscroll');if(!sc)return;const t=TL(S.zoom);const cw=sc.clientWidth;setZoom('rm',Math.floor((cw-220)/(Math.max(cw,t.minW)-220)*1000)/1000);sc.scrollLeft=0}}
document.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey))return;const k=e.target.closest&&(e.target.closest('.canvas')?'dg':e.target.closest('.tlscroll')?'rm':null);if(!k)return;
  e.preventDefault();setZoom(k,zget(k)*Math.exp(-Math.max(-60,Math.min(60,e.deltaY))*.004),{x:e.clientX,y:e.clientY})},{passive:false});

      else if(s.type==='data')o+=`<path class="body" d="M${g.x} ${g.y+10}a${g.w/2} 10 0 0 1 ${g.w} 0v${g.h-20}a${g.w/2} 10 0 0 1 ${-g.w} 0z" fill="${fill}" stroke="#90a4ae"/><path d="M${g.x} ${g.y+10}a${g.w/2} 10 0 0 0 ${g.w} 0" fill="none" stroke="#90a4ae"/>`;
      else if(s.type==='doc')o+=`<path class="body" d="M${g.x} ${g.y}h${g.w}v${g.h-10}c${-g.w/4} -12 ${-g.w/2} 12 ${-g.w*0.75} 4s${-g.w/4} 6 ${-g.w/4} 6z" fill="${fill}" stroke="#90a4ae"/>`;
      else o+=`<rect class="body" x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="8" fill="${fill}" stroke="#90a4ae"/>`;
      if(s.type==='sub')o+=`<rect x="${g.cx-7}" y="${g.y+g.h-16}" width="14" height="12" fill="#fff" stroke="#90a4ae"/><path d="M${g.cx-4} ${g.y+g.h-10}h8M${g.cx} ${g.y+g.h-14}v8" stroke="#546e7a"/>`;
      const isNote=s.type==='note';const ln=wrap(s.label,isNote?24:17).slice(0,2);const hasSub=!!s.sub&&!isNote;
      const tot=ln.length+(hasSub?1:0);const y0=g.cy-(tot-1)*8+4.5-(s.type==='sub'?5:0);
      ln.forEach((t,k)=>o+=`<text x="${g.cx}" y="${y0+k*16}" font-size="${isNote?12:13}" font-weight="${isNote?400:500}" text-anchor="middle" fill="#212121">${esc(t)}</text>`);
      if(hasSub)o+=`<text x="${g.cx}" y="${y0+ln.length*16}" font-size="11" text-anchor="middle" fill="#546e7a">${esc(s.sub)}</text>`}
    if(sel||from)o+=`<rect x="${g.x-5}" y="${g.y-5}" width="${g.w+10}" height="${g.h+10}" rx="10" fill="none" stroke="${from?'#2e7d32':'#1976d2'}" stroke-width="2" ${from?'stroke-dasharray="5 4"':''}/>`;
    if(interactive&&S.tool==='select'){o+='<g class="handles">';
      [['r',g.x+g.w+16,g.cy,0],['l',g.x-16,g.cy,180],['t',g.cx,g.y-16,-90],['b',g.cx,g.y+g.h+16,90]].forEach(([sd,hx,hy,rot])=>
        o+=`<g class="hdl" data-handle="${sd}" data-id="${s.id}" transform="translate(${hx} ${hy}) rotate(${rot})"><title>Drag to connect · click to add a connected step</title><circle r="9"/><path d="M-3 -4L4 0L-3 4z" fill="#fff"/></g>`);
      o+='</g>'}
    o+='</g>'});
  if(interactive)o+=`<g class="hits">${hitLayer}</g>`;
  if(interactive&&S.tool==='select'){
    const TRASH='<path d="M-5 -4h10M-3.5 -4l.6 9h5.8l.6-9M-1.6 -4v-1.6h3.2v1.6" fill="none" stroke="#c62828" stroke-width="1.4" stroke-linejoin="round"/>';
    const DUP='<rect x="-4.5" y="-2.5" width="7" height="7.5" rx="1" fill="none" stroke="#424242" stroke-width="1.4"/><path d="M-2 -2.5v-2.5h7v7.5h-2.5" fill="none" stroke="#424242" stroke-width="1.4"/>';
    const ids=selIds();
    if(ids.length&&!DRAG){const g=geo(byId(S.selShape&&byId(S.selShape)?S.selShape:ids[0]));let by=g.y-58;if(by<4)by=g.y+g.h+30;const bx=g.cx-(ids.length>1?18:36);
      o+=`<g class="fabbar" transform="translate(${bx} ${by})">`;
      if(ids.length===1)o+=`<g class="fab" data-act="dupshape" transform="translate(16 14)"><title>Duplicate (Ctrl+D)</title><rect x="-15" y="-13" width="30" height="26" rx="6"/>${DUP}</g>`;
      o+=`<g class="fab del" data-act="delsel" transform="translate(${ids.length===1?52:18} 14)"><title>Delete${ids.length>1?' '+ids.length+' shapes':''} (Delete key)</title><rect x="-15" y="-13" width="30" height="26" rx="6"/>${TRASH}</g></g>`}
    if(S.selEdge!=null&&dg.edges[S.selEdge]&&!DRAG){const e=dg.edges[S.selEdge];const pts=smartRoute(e.a,e.fs,e.b,e.ts);let bi=0,bl=-1;
      for(let i=0;i<pts.length-1;i++){const l=Math.abs(pts[i+1][0]-pts[i][0])+Math.abs(pts[i+1][1]-pts[i][1]);if(l>bl){bl=l;bi=i}}
      const mx=(pts[bi][0]+pts[bi+1][0])/2,my=(pts[bi][1]+pts[bi+1][1])/2;const vert=pts[bi][0]===pts[bi+1][0];
      o+=`<g class="fab del" data-act="deledge" transform="translate(${vert?mx-20:mx} ${vert?my:my+20})"><title>Delete connector (Delete key)</title><circle r="13"/>${TRASH}</g>`}
  }
  if(interactive)o+='<g id="dragLayer" pointer-events="none"></g>';
  return o+'</svg>'}

function fillTokens(t){return String(t).replace(/\{project\}/g,'Payments Platform').replace(/\{user\}/g,'Ajitav Dutta').replace(/\{date\}/g,'06 Nov 2026')}
function wmLayer(scale){const w=S.wm;if(!w.on)return '';const col=w.color,op=w.op/100;
  const txt=esc(fillTokens(w.text||' '));
  const logo=w.img?`<img src="${w.img}" alt="" style="max-width:40%;max-height:40%;object-fit:contain">`:`<span style="display:flex;align-items:center;gap:.6em;color:${col};font-weight:700;font-size:${3.2*scale}cqw"><svg viewBox="0 0 24 24" style="width:1.4em;height:1.4em"><path d="M12 2l9 5v10l-9 5-9-5V7z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7l4.5 2.5v5L12 17l-4.5-2.5v-5z" fill="currentColor"/></svg>YOUR LOGO</span>`;
  const fs=Math.min(6,96/Math.max(8,fillTokens(w.text).length))*scale/2.2;
  if(w.pos==='corner')return `<div class="wm" aria-hidden="true" style="align-items:flex-end;justify-content:flex-end;padding:0 4% 6% 0"><span style="opacity:${Math.min(1,op*3)};color:${col};font-weight:700;font-size:${1.5*scale/2.2}cqw;letter-spacing:.1em">${w.type==='image'?logo.replace('max-width:40%;max-height:40%','max-width:12%;max-height:12%'):txt}</span></div>`;
  if(w.pos==='tiled')return `<div class="wm tiled" aria-hidden="true">${Array.from({length:12}).map(()=>w.type==='image'?`<span style="opacity:${op};transform:rotate(-28deg);font-size:.5em">${logo.replace('max-width:40%;max-height:40%','max-width:60%;max-height:60%')}</span>`:`<span class="t" style="opacity:${op};color:${col};font-size:${1.6*scale/2.2}cqw">${txt}</span>`).join('')}</div>`;
  return `<div class="wm" aria-hidden="true"><span class="t" style="opacity:${op};color:${col};font-size:${fs}cqw;display:flex;justify-content:center">${w.type==='image'?logo:txt}</span></div>`}

/* detailed roadmap chart used for PDF / PNG export */
function roadmapExportSVG(zoom,range,opts){opts=opts||{};const legend=opts.legend!==false;
  const t=TL(zoom,range);const inR=d=>d>=t.R[0]&&d<=t.R[1];const LW=250;let TW=1150;
  const HD=58,MR=24;let GR=26,ER=34;const top0=0,bodyTop=HD+MR;
  const fit=(str,px,fs)=>{const n=Math.max(0,Math.floor(px/(fs*0.56)));return str.length>n?(n>1?str.slice(0,n-1)+'…':''):str};
  const rows=[];TEAMS.forEach(tm=>{const items=S.epics.filter(e=>e.team===tm.name&&(!range||(e.e>t.R[0]&&e.s<t.R[1])));if(range&&!items.length)return;rows.push({team:tm,count:items.length});items.forEach(e=>rows.push({e}))});
  const LEG=legendLayout(zoom);
  /* fit the chart to the space it will be shown in: epic rows take the spare height, then the timeline widens or narrows to match */
  let legH=legend?26+LEG.height(LW+TW+2):2;
  if(opts.aspect&&isFinite(opts.aspect)&&opts.aspect>0){const A=opts.aspect,nE=rows.filter(r=>!r.team).length,nG=rows.length-nE;
    for(let pass=0;pass<2;pass++){const W0=LW+TW+2,fixed=HD+MR+legH,avail=W0/A-fixed;
      const kAll=avail/(nE*34+nG*26);GR=26*Math.min(Math.max(kAll,.8),1.25);
      ER=34*Math.min(Math.max((avail-nG*GR)/(nE*34),.72),2.6);
      const Hused=fixed+nG*GR+nE*ER;TW=Math.max(600,Math.round(Hused*A)-LW-2);if(legend)legH=26+LEG.height(LW+TW+2)}}
  const W=LW+TW+2,X=d=>LW+t.f(d)*TW;LEG.width=W;
  let y=bodyTop;rows.forEach(r=>{r.y=y;r.h=r.team?GR:ER;y+=r.h});const bodyBot=y;
  const ms=[{k:'M1',name:'Beta launch',d:MS.beta.d,date:'15 Jan 2027'},{k:'M2',name:'General availability (GA)',d:MS.ga.d,date:'20 Apr 2027'}];
  const legY=bodyBot+26;const H=bodyBot+legH;
  let o=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="${opts.aspect?'xMidYMid':'xMidYMin'} meet" style="font-family:Roboto,system-ui,sans-serif">
   <defs><pattern id="ipH" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f7f9fa"/><rect width="3" height="8" fill="#cfd8dc"/></pattern>
   <pattern id="fzH" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="none"/><rect width="2.5" height="8" fill="rgba(84,110,122,.28)"/></pattern></defs>`;
  /* --- header --- */
  o+=`<rect x="0" y="0" width="${W}" height="${HD}" fill="#fff"/>`;
  o+=`<rect x="0" y="0" width="${LW}" height="${HD}" fill="#f5f7f8"/><text x="12" y="25" font-size="12" font-weight="700" fill="#37474f" letter-spacing=".5">TEAM / EPIC</text><text x="12" y="43" font-size="11" fill="#616161">${{months:'Months',sprints:'2-week sprints',pis:'Program Increments'}[zoom]}</text>`;
  t.head.forEach(c=>{const x1=X(c.a),x2=X(c.b),w=x2-x1;if(w<=0)return;const cx=(x1+x2)/2;
    const cur=/\bcur\b/.test(c.cls),ip=/\bip\b/.test(c.cls);const fill=cur?'#e3f2fd':ip?'url(#ipH)':/piband/.test(c.cls)?'#eceff1':'#fff';
    o+=`<rect x="${x1}" y="${c.top}" width="${w}" height="${zoom==='months'?HD:c.h+(c.top?HD-55:0)}" fill="${fill}" stroke="#b0bec5" stroke-width="1"/>`;
    const fg=cur?'#0d47a1':'#212121';
    if(zoom==='months'){o+=`<text x="${x1+10}" y="25" font-size="14" font-weight="500" fill="${fg}">${esc(c.label)}</text><text x="${x1+10}" y="43" font-size="11" fill="#616161">${esc(c.sub||'')}</text>`}
    else if(/piband/.test(c.cls)){o+=`<text x="${cx}" y="${c.top+15}" font-size="11.5" font-weight="700" text-anchor="middle" fill="#37474f">${esc(fit(c.label,w-8,11.5))}</text>`}
    else if(/sprint/.test(c.cls)){const hh=HD-22;o+=`<text x="${cx}" y="${22+hh/2-3}" font-size="12.5" font-weight="700" text-anchor="middle" fill="${fg}">${esc(c.label)}</text><text x="${cx}" y="${22+hh/2+12}" font-size="9.6" text-anchor="middle" fill="${cur?'#0d47a1':'#455a64'}">${esc(fit(c.sub||'',w-4,9.6))}</text>`}
    else if(/pibig/.test(c.cls)){o+=`<text x="${cx}" y="16" font-size="13" font-weight="700" text-anchor="middle" fill="#212121">${esc(c.label)}</text><text x="${cx}" y="30" font-size="10.5" text-anchor="middle" fill="#616161">${esc(c.sub||'')}</text>`}
    else{o+=`<text x="${cx}" y="${c.top+(HD-34)/2+4}" font-size="10" font-weight="${cur?700:500}" text-anchor="middle" fill="${cur?'#0d47a1':'#455a64'}">${esc(c.label)}</text>`}});
  /* --- milestone marker row --- */
  o+=`<rect x="0" y="${HD}" width="${W}" height="${MR}" fill="#fcfcfc"/><text x="12" y="${HD+16}" font-size="11" fill="#616161">Milestones</text>`;
  /* --- body: zebra rows --- */
  rows.forEach((r,i)=>{if(r.team)o+=`<rect x="0" y="${r.y}" width="${W}" height="${r.h}" fill="#eef1f3"/>`;else if(i%2)o+=`<rect x="${LW}" y="${r.y}" width="${TW}" height="${r.h}" fill="#fafbfc"/>`});
  /* IP sprint bands + code freeze band */
  t.bands.forEach(b=>o+=`<rect x="${X(b.a)}" y="${bodyTop}" width="${X(b.b)-X(b.a)}" height="${bodyBot-bodyTop}" fill="url(#ipH)" opacity=".7"/>`);
  const fzIn=MS.freeze.e>t.R[0]&&MS.freeze.s<t.R[1];
  if(fzIn)o+=`<rect x="${X(MS.freeze.s)}" y="${HD}" width="${X(MS.freeze.e)-X(MS.freeze.s)}" height="${bodyBot-HD}" fill="url(#fzH)" stroke="#546e7a" stroke-dasharray="3 3"/>`;
  /* column boundaries: every column, stronger at PI edges */
  const colEdges=new Map();
  t.head.forEach(c=>{const strong=/piband|pibig|first/.test(c.cls)||(zoom==='months'&&false);[c.a,c.b].forEach(d=>{if(d<=t.R[0]||d>=t.R[1])return;const k=Math.round(X(d)*10);colEdges.set(k,Math.max(colEdges.get(k)||0,strong?2:1))})});
  colEdges.forEach((w,k)=>o+=`<line x1="${k/10}" x2="${k/10}" y1="${HD}" y2="${bodyBot}" stroke="${w>1?'#90a4ae':'#cfd8dc'}" stroke-width="${w>1?1.6:1}"/>`);
  /* row separators */
  rows.forEach(r=>o+=`<line x1="0" x2="${W}" y1="${r.y+r.h}" y2="${r.y+r.h}" stroke="${r.team?'#cfd8dc':'#e6e9eb'}"/>`);
  o+=`<line x1="0" x2="${W}" y1="${bodyTop}" y2="${bodyTop}" stroke="#b0bec5"/>`;
  /* milestone and today lines sit under the bars so bar text stays readable */
  const msIn=ms.filter(m=>inR(m.d));const tIn=false; /* exports never show the Today line */
  msIn.forEach(m=>{const x=X(m.d);o+=`<line x1="${x}" x2="${x}" y1="${HD+MR-4}" y2="${bodyBot}" stroke="#6a1b9a" stroke-width="1.8" stroke-dasharray="5 4"/>`});
  const tx=X(TODAY+.5);if(tIn)o+=`<line x1="${tx}" x2="${tx}" y1="${HD}" y2="${bodyBot}" stroke="#d32f2f" stroke-width="2"/>`;
  /* labels and bars */
  rows.forEach(r=>{if(r.team){const my=r.y+r.h/2;o+=`<rect x="10" y="${my-5}" width="10" height="10" rx="2" fill="${r.team.c}"/><text x="28" y="${my+4.5}" font-size="12.5" font-weight="700" fill="#212121">${esc(r.team.name)}</text><text x="${LW-10}" y="${my+4.5}" font-size="11" text-anchor="end" fill="#616161">${r.count} epic${r.count===1?'':'s'}</text>`;return}
    const e=r.e,st=STATUS[e.st];
    ;const ey=r.y+r.h/2;o+=`<text x="12" y="${ey-3}" font-size="10.5" fill="#1565c0" font-family="Roboto Mono,monospace">${esc(e.key)}</text><text x="12" y="${ey+10}" font-size="11.5" fill="#212121">${esc(fit(e.title,LW-24,11.5))}</text>`;
    const x1=X(e.s)+2,x2=X(e.e)-2,w=Math.max(4,x2-x1);const bh=Math.min(r.h-12,30),by=r.y+(r.h-bh)/2;
    o+=`<rect x="${x1}" y="${by}" width="${w}" height="${bh}" rx="5" fill="${st.c}"/><rect x="${x1+4}" y="${by+bh-5}" width="${Math.max(0,(w-8)*e.pct/100)}" height="2.5" rx="1" fill="#fff" opacity=".85"/>`;
    const pct=e.pct+'%';const room=w-16-(w>70?pct.length*6.5+6:0);const lab=fit(e.title,room,11);
    if(lab)o+=`<text x="${x1+7}" y="${by+bh/2+2}" font-size="11" font-weight="500" fill="#fff">${esc(lab)}</text>`;
    if(w>70)o+=`<text x="${x2-7}" y="${by+bh/2+2}" font-size="10.5" text-anchor="end" fill="#fff" opacity=".95">${pct}</text>`;
    if(e.s<t.R[0])o+=`<path d="M${X(t.R[0])+3} ${by+bh/2}l6 -5v10z" fill="#fff"/>`;
    if(e.e>t.R[1])o+=`<path d="M${X(t.R[1])-3} ${by+bh/2}l-6 -5v10z" fill="#fff"/>`;});
  /* milestone lines + markers */
  msIn.forEach(m=>{const x=X(m.d);o+=`<path d="M${x} ${HD+4}l7 7.5l-7 7.5l-7 -7.5z" fill="#6a1b9a"/><text x="${x+11}" y="${HD+16}" font-size="11" font-weight="700" fill="#4a148c">${m.k}</text>`});
  const fx=(X(MS.freeze.s)+X(MS.freeze.e))/2;if(fzIn)o+=`<text x="${fx}" y="${HD+16}" font-size="10" font-weight="700" text-anchor="middle" fill="#37474f">CF</text>`;
  if(tIn)o+=`<rect x="${tx-11}" y="${HD+5}" width="22" height="14" rx="3" fill="#d32f2f"/><text x="${tx}" y="${HD+15.5}" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">T</text>`;
  /* outer frame + label column edge */
  o+=`<line x1="${LW}" x2="${LW}" y1="0" y2="${bodyBot}" stroke="#90a4ae" stroke-width="1.4"/><rect x=".5" y=".5" width="${W-1}" height="${bodyBot-.5}" fill="none" stroke="#90a4ae"/>`;
  /* legend (PDF / PNG only; slides show it top-right instead) */

/* legend under the chart for PDF / PNG; wraps onto extra lines when the chart is narrow */
function legendLayout(zoom){
  const sections=[['MILESTONES',[
     ['<path d="M0 -6l6 6l-6 6l-6 -6z" fill="#6a1b9a"/>','<tspan font-weight="700" fill="#4a148c">M1</tspan>  Beta launch · 15 Jan 2027'],
     ['<path d="M0 -6l6 6l-6 6l-6 -6z" fill="#6a1b9a"/>','<tspan font-weight="700" fill="#4a148c">M2</tspan>  General availability (GA) · 20 Apr 2027'],
     ['<rect x="-6" y="-6" width="12" height="12" fill="url(#fzH)" stroke="#546e7a" stroke-dasharray="2 2"/>','<tspan font-weight="700" fill="#37474f">CF</tspan>  Code freeze · 15–31 Mar 2027']]],
    ['STATUS',Object.values(STATUS).map(v=>[`<rect x="-6" y="-5" width="12" height="10" rx="2" fill="${v.c}"/>`,esc(v.label)]).concat([['<rect x="-6" y="-1" width="12" height="2.5" fill="#9e9e9e"/>','Progress from Jira issues']])]];
  if(zoom!=='months')sections.push(['SPRINTS',[['<rect x="-6" y="-6" width="12" height="12" fill="url(#ipH)" stroke="#b0bec5"/>','IP sprint (Innovation &amp; Planning)'],
     ['<rect x="-6" y="-6" width="12" height="12" fill="#e3f2fd" stroke="#90caf9"/>',`Current sprint · ${CUR.pi.name} S${CUR.n} (${date(CUR.s)} – ${date(CUR.e-1)})`],
     ['<rect x="-1" y="-7" width="2" height="14" fill="#90a4ae"/>','PI boundary']]]);
  const iw=txt=>26+txt.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').length*6.1+22;
  const plan=W=>{const out=[];let ly=0;sections.forEach(([label,items],si)=>{if(si)ly+=24;let lx=110;out.push({label,ly});
      items.forEach(([sym,txt])=>{const w=iw(txt);if(lx>110&&lx+w>W-4){ly+=20;lx=110}out.push({sym,txt,lx,ly});lx+=w})});return {out,h:ly+18}};
  const L={width:0,height:W=>plan(W).h,draw:y0=>{let o='';plan(L.width).out.forEach(it=>{if(it.label)o+=`<text x="0" y="${y0+it.ly}" font-size="11" font-weight="700" fill="#37474f" letter-spacing=".6">${it.label}</text>`;
      else o+=`<g transform="translate(${it.lx} ${y0+it.ly-4})">${it.sym}</g><text x="${it.lx+16}" y="${y0+it.ly}" font-size="11.5" fill="#212121">${it.txt}</text>`});return o}};
  return L}
/* compact legend for the top-right of a slide */
function legendHTML(range){const R=range||TL(S.zoom).R;const inR=d=>d>=R[0]&&d<=R[1];
  const it=(sym,txt)=>`<span class="it">${sym}${txt}</span>`;const dm='<i class="sym dm"></i>';
  const ms=[];if(inR(MS.beta.d))ms.push(it(dm,'<b class="k mk">M1</b> Beta launch · 15 Jan'));if(inR(MS.ga.d))ms.push(it(dm,'<b class="k mk">M2</b> GA · 20 Apr'));
  if(MS.freeze.e>R[0]&&MS.freeze.s<R[1])ms.push(it('<i class="sym fz"></i>','<b class="k">CF</b> Code freeze · 15–31 Mar'));
  const st=Object.values(STATUS).map(v=>it(`<i class="sym" style="background:${v.c}"></i>`,v.label));
  const sp=S.zoom==='months'?[]:[it('<i class="sym ip"></i>','IP sprint'),it('<i class="sym cu"></i>','Current sprint')];
  return `<div class="slegend" aria-label="Legend">${ms.length?`<div class="row">${ms.join('')}</div>`:''}<div class="row">${st.concat(sp).join('')}</div></div>`}

function loadCSV(text,name,size){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length&&rows.length<2;i++){const c=text[i];

    else if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}
  if(rows.length<2&&(cell||row.length)){row.push(cell);rows.push(row)}
  const hdr=rows[0]||[],ex=rows[1]||[];if(hdr.length<2)return false;
  const lines=(text.match(/\n/g)||[]).length;const used=new Set(),cols=[];

    for(const [f,al] of Object.entries(ALIASES)){if(used.has(f))continue;if(al.some(a=>lh===a||lh.includes(a))){field=f;break}}
    if(field){used.add(field);cols.push({col:h,sample:(ex[i]||'').slice(0,40),field})}});
  const unmatched=hdr.map((h,i)=>({col:h,sample:(ex[i]||'').slice(0,40),field:null})).filter(c=>!cols.some(x=>x.col===c.col)).slice(0,2);
  S.cols=cols.concat(unmatched);S.extraCols=Math.max(0,hdr.length-S.cols.length);
  S.rows=Math.max(1,lines-1);S.file={name,size,kind:'Jira CSV ('+hdr.length+' columns)'};return true}

let DRAG=null,suppressClick=false;
const OPP={r:'l',l:'r',t:'b',b:'t'};
const SHAPE_DEFAULTS={task:'New step',decision:'Decision?',sub:'Sub-process',doc:'Document',data:'Data store',note:'Add a note'};
function svgPoint(e){const svg=$('#svgHost svg');const r=svg.getBoundingClientRect();const {W,H}=dgSize();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
const byId=id=>S.dg.shapes.find(x=>x.id===id);
function laneAt(y,skipId){const L=laneLayout(skipId);for(let i=0;i<L.length;i++)if(y<L[i].top+L[i].h)return i;return L.length-1}
function shapeAt(x,y,exclude){for(const s of [...S.dg.shapes].reverse()){if(s.id===exclude)continue;const g=geo(s);if(x>=g.x-10&&x<=g.x+g.w+10&&y>=g.y-10&&y<=g.y+g.h+10)return s}return null}
function nearestSide(g,x,y){let best='l',bd=1e9;['l','r','t','b'].forEach(sd=>{const [ax,ay]=anchor(g,sd);const d=(ax-x)**2+(ay-y)**2;if(d<bd){bd=d;best=sd}});return best}
function overlaps(li,x,w,yy,h,skip){const lid=S.dg.lanes[li].id;return S.dg.shapes.some(s=>{if(s.id===skip||s.lane!==lid)return false;const sh=SZ[s.type],sy=ry(s);return x<s.x+sh[0]+24&&x+w+24>s.x&&yy<sy+sh[1]+24&&yy+h+24>sy})}
function newShapeAt(type,x,y){const li=laneAt(y);const [w,h]=SZ[type];const id='n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  let r=Math.max(16,Math.round((y-laneLayout()[li].top-h/2)/8)*8);if(Math.abs(r-(LANE_MIN-h)/2)<14)r=null;
  S.dg.shapes.push({id,type,lane:S.dg.lanes[li].id,x:Math.max(LABEL_W+16,Math.round((x-w/2)/8)*8),ry:r,label:SHAPE_DEFAULTS[type]||'',sub:''});
  S.selShape=id;S.selEdge=null;S.insp='shape';S.dgSaved=false;return id}
function focusLabel(){const inp=document.querySelector('[data-on="slabel"]');if(inp){inp.focus();inp.select()}}
function cloneType(s){return s.type==='start'||s.type==='end'?'task':s.type}
const TYPE_NAME={task:'step',decision:'decision',sub:'sub-process',doc:'document',data:'data store',note:'note',end:'end point',start:'start point'};
function quickAdd(fromId,side,type){type=type||'task';const s=byId(fromId),g=geo(s);const before=JSON.stringify(S.dg);let li=S.dg.lanes.findIndex(l=>l.id===s.lane);const [w,h]=SZ[type];let x,r=null,stacked=false;
  if(side==='r'||side==='l'){x=side==='r'?g.x+g.w+64:g.x-64-w;r=ry(s)+(g.h-h)/2;if(Math.abs(r-(LANE_MIN-h)/2)<1)r=null}
  else if(side==='b'){x=g.cx-w/2;if(li+1<S.dg.lanes.length)li++;else{r=ry(s)+g.h+48;stacked=true}}
  else{x=g.cx-w/2;if(li>0)li--;else if(ry(s)-48-h>=16){r=ry(s)-48-h;stacked=true}else{toast('No lane above this one');return}}
  x=Math.round(x/8)*8;const yy=r!=null?r:(LANE_MIN-h)/2;const step=(side==='l'?-1:1)*(w+48);let guard=0;
  while(overlaps(li,x,w,yy,h)&&guard++<20)x+=step;
  if(x<LABEL_W+16){x=g.x+g.w+64;while(overlaps(li,x,w,yy,h)&&guard++<40)x+=w+48}
  S.undo.push(before);const id='n'+Date.now().toString(36);S.dg.shapes.push({id,type,lane:S.dg.lanes[li].id,x,ry:r,label:SHAPE_DEFAULTS[type]||'',sub:''});
  if(stacked)toast('Added below in the same lane — the lane grew to fit');
  S.dg.edges.push({a:fromId,b:id,fs:side,ts:OPP[side]});S.selShape=id;S.selEdge=null;S.insp='shape';S.dgSaved=false;render();focusLabel();toast('Added a '+TYPE_NAME[type]+' connected to '+lbl(fromId),'undo')}
function drawDragLayer(){const L=$('#dragLayer');if(!L||!DRAG)return;const d=DRAG;const g=geo(byId(d.from));const p1=anchor(g,d.side);
  const t=shapeAt(d.x,d.y,d.from);let h='';
  if(t){const gt=geo(t),ts=nearestSide(gt,d.x,d.y);const pts=smartRoute(d.from,d.side,t.id,ts);
    h+=`<rect x="${gt.x-6}" y="${gt.y-6}" width="${gt.w+12}" height="${gt.h+12}" rx="10" fill="rgba(25,118,210,.07)" stroke="#1976d2" stroke-width="2"/>`;
    ['l','r','t','b'].forEach(sd=>{const [ax,ay]=anchor(gt,sd);h+=`<circle cx="${ax}" cy="${ay}" r="${sd===ts?6:4}" fill="${sd===ts?'#1976d2':'#fff'}" stroke="#1976d2" stroke-width="2"/>`});
    h+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#1976d2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahd)"/>`;
  }else{const w=SZ.task[0],hh=SZ.task[1];const ok=d.x>LABEL_W+8;
    h+=`<polyline points="${p1.join(',')} ${d.x},${d.y}" fill="none" stroke="#1976d2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahd)"/>`;
    if(ok){const LL=laneLayout(),li=laneAt(d.y),gy=Math.max(LL[li].top+16,d.y-hh/2);
      h+=`<rect x="${d.x-w/2}" y="${gy}" width="${w}" height="${hh}" rx="8" fill="rgba(255,255,255,.7)" stroke="#1976d2" stroke-dasharray="4 4"/><text x="${d.x}" y="${gy+hh/2+4}" font-size="12" text-anchor="middle" fill="#0d47a1">Drop to add a step</text>`}}
  L.innerHTML=h}
function cancelDrag(){DRAG=null;redrawCanvas()}

  if(h&&S.tool==='select'){hidePicker();e.preventDefault();const [x,y]=svgPoint(e);DRAG={mode:'connect',from:h.dataset.id,side:h.dataset.handle,sx:x,sy:y,x,y,moved:false};try{host.setPointerCapture(e.pointerId)}catch(_){};return}
  const lr=e.target.closest('[data-lane-resize]'),wr=e.target.closest('[data-width-resize]');
  if(lr||wr){e.preventDefault();const [x,y]=svgPoint(e);const i=lr?+lr.dataset.laneResize:-1;DRAG={mode:lr?'lane':'width',i,top:lr?laneLayout()[i].top:0,sx:x,sy:y,moved:false};try{host.setPointerCapture(e.pointerId)}catch(_){}return}
  if(g&&!e.target.classList.contains('hpad')){const [x,y]=svgPoint(e);const s=byId(g.dataset.id);const gg=geo(s);DRAG={mode:S.tool==='select'?'move':'click',id:s.id,sx:x,sy:y,ox:s.x,offY:y-gg.y,moved:false};try{host.setPointerCapture(e.pointerId)}catch(_){}}
});
document.addEventListener('pointermove',e=>{if(!DRAG)return;const [x,y]=svgPoint(e);DRAG.x=x;DRAG.y=y;
  if(!DRAG.moved&&Math.hypot(x-DRAG.sx,y-DRAG.sy)>5){DRAG.moved=true;if(DRAG.mode!=='connect'&&DRAG.mode!=='click')snap();const sv=$('#svgHost svg');sv&&sv.classList.add('dragging')}
  if(!DRAG.moved)return;
  if(DRAG.mode==='move'){const s=byId(DRAG.id);s.x=Math.max(LABEL_W+8,Math.round((DRAG.ox+x-DRAG.sx)/8)*8);
    const li=laneAt(y,s.id);s.lane=S.dg.lanes[li].id;s.ry=Math.max(16,Math.round((y-DRAG.offY-laneLayout(s.id)[li].top)/8)*8);
    S.selShape=s.id;S.selEdge=null;redrawCanvas();const sv=$('#svgHost svg');sv&&sv.classList.add('dragging')}
  else if(DRAG.mode==='lane'){const l=S.dg.lanes[DRAG.i];const fit=laneLayout()[DRAG.i].fit;l.h=Math.max(fit,Math.round((y-DRAG.top)/8)*8);if(l.h===fit)delete l.h;redrawCanvas()}
  else if(DRAG.mode==='width'){const fit=dgFitW();S.dg.w=Math.max(fit,Math.round(x/8)*8);if(S.dg.w===fit)delete S.dg.w;redrawCanvas()}
  else if(DRAG.mode==='connect')drawDragLayer()});
document.addEventListener('pointerup',e=>{if(!DRAG)return;const d=DRAG;DRAG=null;suppressClick=true;
  if(d.mode==='lane'||d.mode==='width'){if(d.moved){S.dgSaved=false;render()}return}
  if(d.mode!=='connect'){if(!d.moved)ACT.shape({dataset:{id:d.id}},{shiftKey:e.shiftKey});else{S.dgSaved=false;render()}return}
  if(!d.moved){hidePicker();quickAdd(d.from,d.side,cloneType(byId(d.from)));return}
  const t=shapeAt(d.x,d.y,d.from);
  if(t){const ts=nearestSide(geo(t),d.x,d.y);
    if(S.dg.edges.some(x=>x.a===d.from&&x.b===t.id)){toast('These shapes are already connected');redrawCanvas();return}
    snap();S.dg.edges.push({a:d.from,b:t.id,fs:d.side,ts});S.selEdge=S.dg.edges.length-1;S.selShape=null;S.insp='shape';S.dgSaved=false;render();toast('Connected '+lbl(d.from)+' → '+lbl(t.id));return}
  if(d.x<LABEL_W+8){cancelDrag();return}
  snap();const id=newShapeAt('task',d.x,d.y);S.dg.edges.push({a:d.from,b:id,fs:d.side,ts:nearestSide(geo(byId(id)),...anchor(geo(byId(d.from)),d.side))});
  render();focusLabel();toast('Added a connected step')});
document.addEventListener('pointercancel',()=>{if(DRAG)cancelDrag()});
function closeCtx(){const c=$('#ctx');if(c)c.classList.remove('open')}
document.addEventListener('contextmenu',e=>{if(S.route!=='swimlanes')return;const host=e.target.closest('#svgHost');if(!host)return;e.preventDefault();
  const g=e.target.closest('g.shape'),eh=e.target.closest('[data-act="edge"]');let items='';
  if(g){const id=g.dataset.id;if(!(id===S.selShape||S.extra.includes(id))){S.selShape=id;S.extra=[];S.selEdge=null;S.insp='shape';render()}
    const n=selIds().length;
    items=(n===1?`<button role="menuitem" data-act="ctxEdit">Edit label</button><button role="menuitem" data-act="dupshape">Duplicate<kbd>Ctrl+D</kbd></button><hr>`:'')+`<button role="menuitem" class="danger" data-act="delsel">Delete${n>1?' '+n+' shapes':''}<kbd>Del</kbd></button>`}
  else if(eh){S.selEdge=+eh.dataset.i;S.selShape=null;S.extra=[];S.insp='shape';render();
    items=`<button role="menuitem" data-act="ctxEdit">Edit label</button><button role="menuitem" data-act="ctxRev">Reverse direction</button><hr><button role="menuitem" class="danger" data-act="deledge">Delete connector<kbd>Del</kbd></button>`}
  else items=`<button role="menuitem" data-act="selectAll">Select all shapes<kbd>Ctrl+A</kbd></button><button role="menuitem" data-act="undo" ${S.undo.length?'':'disabled'}>Undo<kbd>Ctrl+Z</kbd></button>`;
  const c=$('#ctx');c.innerHTML=items;c.classList.add('open');const w=200,h=c.offsetHeight||120;
  c.style.left=Math.min(e.clientX,innerWidth-w-8)+'px';c.style.top=Math.min(e.clientY,innerHeight-h-8)+'px';const f=c.querySelector('button:not([disabled])');f&&f.focus()});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#ctx'))closeCtx();if(!e.target.closest('#picker')&&!e.target.closest('[data-handle]'))hidePicker()},true);
/* draw.io-style shape picker: hover a blue arrow to choose what to add next */
const PICK_TYPES=['task','decision','sub','doc','data','note','end'];
const PICK_LABEL={task:'Task',decision:'Decision',sub:'Sub-process',doc:'Document',data:'Data',note:'Note',end:'End'};
let pickTimer=null,pickHide=null;
function hidePicker(){clearTimeout(pickTimer);clearTimeout(pickHide);const p=$('#picker');if(p)p.classList.remove('open')}
function showPicker(h){if(DRAG||S.tool!=='select')return;const p=$('#picker');const id=h.dataset.id,side=h.dataset.handle;const from=byId(id);if(!from)return;
  const dir={r:'Add to the right of',l:'Add to the left of',t:'Add above',b:'Add below'}[side];
  p.innerHTML=`<div class="ph">${dir} “${esc(lbl(id).slice(0,22))}”</div><div class="pg">${PICK_TYPES.map(t=>`<button role="menuitem" data-act="pickAdd" data-id="${id}" data-side="${side}" data-type="${t}" title="Add a connected ${TYPE_NAME[t]}"><svg viewBox="0 0 24 24" aria-hidden="true">${TOOL_ICON[t]}</svg>${PICK_LABEL[t]}</button>`).join('')}</div>`;
  p.classList.add('open');const r=h.getBoundingClientRect(),pw=p.offsetWidth,ph=p.offsetHeight;let x,y;
  if(side==='r'){x=r.right+8;y=r.top+r.height/2-ph/2}else if(side==='l'){x=r.left-8-pw;y=r.top+r.height/2-ph/2}else if(side==='b'){x=r.left+r.width/2-pw/2;y=r.bottom+8}else{x=r.left+r.width/2-pw/2;y=r.top-8-ph}
  p.style.left=Math.max(8,Math.min(x,innerWidth-pw-8))+'px';p.style.top=Math.max(64,Math.min(y,innerHeight-ph-8))+'px'}
document.addEventListener('pointerover',e=>{if(S.route!=='swimlanes'||e.pointerType==='touch')return;
  const h=e.target.closest&&e.target.closest('[data-handle]');
  if(h){clearTimeout(pickHide);clearTimeout(pickTimer);pickTimer=setTimeout(()=>showPicker(h),380);return}
  if(e.target.closest&&e.target.closest('#picker')){clearTimeout(pickHide);return}
  if($('#picker').classList.contains('open')||pickTimer){clearTimeout(pickTimer);pickTimer=null;clearTimeout(pickHide);pickHide=setTimeout(hidePicker,280)}});
window.addEventListener('scroll',hidePicker,true);
window.addEventListener('scroll',closeCtx,true);

/* inputs */
const ON={
  file:el=>handleImport(el.files[0]),
  openjson:el=>{const f=el.files[0];if(!f)return;readFile(f,t=>{try{const o=JSON.parse(t);if(!o||typeof o!=='object')throw 0;
      if(o.name)S.rmName=String(o.name);S.rmFile=f.name;S.file=null;S.roadmapReady=true;S.saved=true;go('roadmap');render();toast('Opened '+f.name+(o.items?' · '+o.items.length+' items':''))}
    catch(_){toast('That file isn’t a roadmap JSON')}})},
  tpl:()=>toast('Template applied'),
  mapfield:el=>{S.cols[+el.dataset.i].field=el.value==="Choose a field…"?null:el.value;const {total,ok}=mapStats();
    el.classList.toggle('warn',!S.cols[+el.dataset.i].field);const b=$('#mapBadge');b.textContent='Auto-mapped '+ok+' of '+total;b.className='badge '+(ok===total?'ok':'warn');$('#warnbox').innerHTML=warnings()},
  statusmap:el=>{S.statusMap[el.dataset.j]=el.value;render()},
  rmname:el=>{S.rmName=el.value;$('#jsonPrev').textContent=roadmapJSON(true)},
  rmfile:el=>{S.rmFile=el.value},
  ms:el=>{S.ms=el.checked;render()},
  etitle:el=>{const e=S.epics.find(x=>x.key===S.sel);e.title=el.value;S.saved=false;const tl=document.querySelector('.tlscroll');if(tl)tl.innerHTML=timelineHTML()},
  est:el=>{S.epics.find(x=>x.key===S.sel).st=el.value;S.saved=false;render()},
  eteam:el=>{S.epics.find(x=>x.key===S.sel).team=el.value;S.saved=false;render()},
  es:el=>{const e=S.epics.find(x=>x.key===S.sel);if(!el.value)return;const d=dayOf(el.value);if(d>=e.e){toast('Start must be before the end date');render();return}e.s=d;S.saved=false;render()},
  ee:el=>{const e=S.epics.find(x=>x.key===S.sel);if(!el.value)return;const d=dayOf(el.value)+1;if(d<=e.s){toast('End must be after the start date');render();return}e.e=d;S.saved=false;render()},
  enote:el=>{S.epics.find(x=>x.key===S.sel).note=el.value;S.saved=false},
  dgpick:el=>{if(el.value!==S.dg.name){toast('This prototype includes one diagram');el.value=S.dg.name}},
  slabel:el=>{const s=S.dg.shapes.find(x=>x.id===S.selShape);s.label=el.value;S.dgSaved=false;redrawCanvas()},
  ssub:el=>{const s=S.dg.shapes.find(x=>x.id===S.selShape);s.sub=el.value;S.dgSaved=false;redrawCanvas()},
  slane:el=>{const s=S.dg.shapes.find(x=>x.id===S.selShape);s.lane=el.value;s.ry=null;S.dgSaved=false;render()},
  sowner:el=>{S.dg.shapes.find(x=>x.id===S.selShape).owner=el.value;S.dgSaved=false},
  sjira:el=>{S.dg.shapes.find(x=>x.id===S.selShape).jira=el.value;S.dgSaved=false},
  elabel:el=>{const e=S.dg.edges[S.selEdge];if(!e)return;e.label=el.value;S.dgSaved=false;redrawCanvas()},
  efs:el=>{const e=S.dg.edges[S.selEdge];if(!e)return;e.fs=el.value;S.dgSaved=false;redrawCanvas()},
  ets:el=>{const e=S.dg.edges[S.selEdge];if(!e)return;e.ts=el.value;S.dgSaved=false;redrawCanvas()},
  lanename:el=>{S.dg.lanes[+el.dataset.i].name=el.value;S.dgSaved=false;redrawCanvas()},
  dgname:el=>{S.dg.name=el.value;S.dgSaved=false;const h=document.querySelector('#frame h1');if(h)h.textContent=el.value},
  page:el=>{S.page=el.value;renderPreview()},
  scale:el=>{S.scale=el.value;renderPreview()},
  wmon:el=>{S.wm.on=el.checked;render()},
  preset:el=>{S.wm.preset=el.value;if(el.value.startsWith('Draft')){Object.assign(S.wm,{type:'text',text:'DRAFT — not for distribution',pos:'tiled',color:'#424242',op:12})}else if(el.value.startsWith('Company')){Object.assign(S.wm,{type:'image',pos:'corner',op:20})}else Object.assign(S.wm,{type:'text',text:'CONFIDENTIAL — {project}',pos:'diag',color:'#b71c1c',op:14});render()},
  wmtext:el=>{S.wm.text=el.value;renderPreview()},
  wmop:el=>{S.wm.op=+el.value;$('#opLbl').textContent=el.value+'%';renderPreview()},
  logo:el=>{const f=el.files[0];if(!f)return;readFile(f,url=>{S.wm.img=url;render();toast('Logo added to the watermark')},true)},
  stamp:el=>{S.stamp=el.checked;renderPreview()},
  pslidesize:el=>{S.pptx.size=el.value;renderPreview()},
  ptitle:el=>{S.pptx.title=el.checked;S.pslide=0;renderPreview()},
  ptable:el=>{S.pptx.table=el.checked;S.pslide=0;renderPreview()},
  pnotes:el=>{S.pptx.notes=el.checked;renderPreview()},
  qwmon:el=>{S.wm.on=el.checked;refreshQuick();if(el.checked){const t=$('#qwmText');if(t){t.focus();t.select()}}},
  qwmtext:el=>{S.wm.text=el.value;renderQuickPreview()},
  qwmop:el=>{S.wm.op=+el.value;$('#qOp').textContent=el.value+'%';renderQuickPreview()},
  qpage:el=>{S.page=el.value;renderQuickPreview()},
  qscale:el=>{S.scale=el.value;renderQuickPreview()},
  qstamp:el=>{S.stamp=el.checked;renderQuickPreview()}
};
function onInput(e){const el=e.target.closest('[data-on]');if(!el)return;const h=ON[el.dataset.on];if(!h)return;
  const live=['elabel','wmtext','wmop','qwmtext','qwmop','slabel','ssub','lanename','dgname','rmname','rmfile','etitle','enote','sowner','sjira'];
  if(e.type==='input'&&!live.includes(el.dataset.on))return;
  if(e.type==='change'&&live.includes(el.dataset.on)&&el.dataset.on!=='wmop'&&el.dataset.on!=='qwmop')return;
  h(el,e)}
document.addEventListener('input',onInput);document.addEventListener('change',onInput);

/* drag & drop on import */
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');handleImport(e.dataTransfer.files[0])}});

show(location.hash.slice(1)||'home');
</script>
</body>
</html>
